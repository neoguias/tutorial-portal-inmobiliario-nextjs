services:
  meilisearch:
    image: getmeili/meilisearch:v1.42
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meilisearch:/meili_data

volumes:
  meilisearch:
